  stationType: portable
  skillLevel: 1
  loadClass: light
  unilateral: true
  repPaceSecPerRep: 2
  systemicCost: low
  constraints: []
  substitutes:
    - copenhagen-plank
    - sumo-squat
    - cossack-squat
    - band-squat
  scalingEasier: sumo-squat
  scalingHarder: cossack-squat
  instructionsHe: |-
    1. עגן את הגומייה נמוך לצד שלך — סביב רגל של שולחן כבד או בעוגן ייעודי בתחתית הדלת — והשחל את הקרסול הקרוב לעיגון לתוך הלולאה.
    2. עמוד זקוף במרחק שבו הגומייה כבר מתוחה, והיעזר בקיר או במשענת כיסא לאיזון.
    3. משוך את הרגל הפנימית על פני הגוף אל הצד הרחוק, עד שהיא חוצה קלות את הרגל התומכת.
    4. החזר את הרגל באיטיות לנקודת ההתחלה. בצע את כל החזרות על צד אחד ואז החלף צד.
    שים לב: ודא שהעיגון לא זז ושהגומייה לא שחוקה, והשאר את האגן פונה קדימה — אל תסובב את הגוף כדי להרחיק את הרגל.
