    - mountain-climbers
    - spider-crawl
    - air-bike
  scalingEasier: mountain-climbers
  scalingHarder: burpee
  primaryMuscles:
    - abdominals
  secondaryMuscles:
    - shoulders
    - glutes
    - quadriceps

  # ---- D1-bands ----
  instructionsHe: |-
    1. התייצב בעמדת שכיבות סמיכה עם ידיים ישרות מתחת לכתפיים.
    2. משוך ברך אחת אל המרפק הנגדי — הסיבוב הזה הוא ההבדל מטיפוס הרים רגיל, שבו הברך נוסעת ישר קדימה.
    3. החזר את הרגל אחורה והחלף רגליים ברצף, כמו ריצה במקום באלכסון.
    שים לב: האגן נשאר נמוך ומקביל לרצפה — אם הישבן עולה לאוויר, האט עד שהתנועה נשלטת.
band-reverse-fly:
  source: Back_Flyes_-_With_Bands
  trainingType: base
  provenanceId: free-exercise-db
  addedOn: "2026-09-16"
  nameHe: פתיחת ידיים לאחור עם גומייה
  nameEn: Band Reverse Fly
  modality: weights
  pattern: pullH
  equipment:
    - bands
  stationType: portable
  skillLevel: 1
  loadClass: light
  repPaceSecPerRep: 2
  systemicCost: low
  constraints: []
  substitutes:
    - band-pull-apart
    - dumbbell-rear-delt-fly
    - prone-t-raise
    - face-pull
  scalingEasier: prone-t-raise
  scalingHarder: face-pull
  instructionsHe: |-
    1. עמוד על אמצע הגומייה בשתי כפות הרגליים ואחוז קצה בכל יד, ידיים מוצלבות מתחת לחזה.
    2. הטה את הגו קדימה מהירכיים עד כ-45 מעלות, גב ישר וחזה פתוח.
    3. פתח את הידיים לצדדים עד גובה הכתפיים, תוך קירוב השכמות זו לזו.
    4. חזור באיטיות פנימה בלי לשחרר את המתח בגומייה.
    שים לב: הידיים כמעט ישרות והתנועה מגיעה מהשכמות — אל תכופף את המרפקים ותמשוך כמו בחתירה.
band-pull-through:
  source: Band_Good_Morning_Pull_Through
  trainingType: base
  provenanceId: free-exercise-db
  addedOn: "2026-09-16"
  nameHe: משיכת גומייה בין הרגליים
  nameEn: Band Pull-Through
  modality: weights
  pattern: hinge
  equipment:
    - bands
  stationType: portable
  skillLevel: 2
  loadClass: light
  repPaceSecPerRep: 2.5
  systemicCost: low
  constraints: []
  substitutes:
    - cable-pull-through
    - band-good-morning
    - kettlebell-swing
    - glute-bridge
  scalingEasier: glute-bridge
  scalingHarder: kettlebell-swing
  instructionsHe: |-
    1. עגן את הגומייה נמוך מאחוריך — סביב רגל של שולחן כבד, או בעוגן ייעודי בתחתית הדלת.
    2. עמוד עם הגב לעיגון, העבר את הגומייה בין הרגליים ואחוז בשתי ידיים, וצעד קדימה עד שהיא נמתחת.
    3. דחוף את הישבן לאחור והטה את הגו קדימה עם גב ישר — הידיים נמשכות לאחור בין הרגליים.
    4. דחוף את האגן קדימה וחזור לעמידה זקופה תוך כיווץ הישבן, בלי למשוך עם הידיים.
    שים לב: ודא שהעיגון לא זז ושהגומייה לא שחוקה — היא נמתחת בדיוק בין הרגליים ואסור שתשתחרר לאחור.
band-hip-adduction:
  source: Band_Hip_Adductions
  trainingType: base
  provenanceId: free-exercise-db
  addedOn: "2026-09-16"
  nameHe: קירוב ירך עם גומייה
  nameEn: Band Hip Adduction
  modality: weights
  pattern: lunge
  equipment:
