# ============================================================
# המנוע — תיוג מאגר התרגילים (הנכס של אבן דרך 1)
# נכתב ומתוחזק ביד; נערך גם דרך עורך המאגר ב-/admin/exercises.
# scripts/import-exercises.ts ממזג את הקובץ הזה עם ה-snapshot של
# Free Exercise DB וטוען למסד. הוולידציה אוכפת אפס תיוג חסר.
#
# source: מזהה ב-Free Exercise DB (Unlicense), או null לרשומה מקורית שלנו.
# stationType נגזר מהציוד בכלל קבוע: ציוד תחנה (rack/bench/cable/rower/
#   pullup-bar/dip-station/box/barbell) => fixed; ציוד נייד => portable; בלי ציוד => none.
# repPaceSecPerRep: שניות לחזרה בקצב אימון עצים מתון (איזומטרי: חזרה = שנייה).
# substitutes: מדורג לפי קרבת אפקט (דפוס/אופי דומים קודם). זמינות תחנה
#   נבדקת ע"י המנוע בזמן אמת — תחליף שמדורג ראשון אך תפוס פשוט מדולג.
# ============================================================

air-squat:
  source: Bodyweight_Squat
  trainingType: base
  provenanceId: free-exercise-db
  addedOn: "2026-08-23"
  nameHe: סקוואט
  nameEn: Air Squat
  modality: gymnastics
  pattern: squat
  equipment: []
  stationType: none
  skillLevel: 1
  loadClass: bodyweight
  repPaceSecPerRep: 2
  systemicCost: med
  constraints: []
  substitutes:
    - goblet-squat
    - walking-lunge
    - jump-squat
    - band-squat
    - sumo-squat
    - wall-sit
  scalingEasier: chair-squat
  scalingHarder: goblet-squat
  instructionsHe: |-
    1. עמוד עם רגליים ברוחב כתפיים, אצבעות מעט החוצה.
    2. דחוף את הישבן לאחור ורד למטה כאילו אתה מתיישב על כיסא.
    3. רד עד שהירכיים מקבילות לרצפה או מעט מתחת.
    4. דחוף מהעקבים וחזור לעמידה מלאה.
    שים לב: שמור על גב ישר וחזה מורם לאורך כל התנועה.
