  substitutes: ["capoeira-negativa"]
  scalingEasier: "capoeira-negativa"
  scalingHarder: null
  primaryMuscles: ["glutes", "quadriceps"]
  secondaryMuscles: ["shoulders", "abdominals", "triceps"]
  instructionsHe: |-
    1. התחל בנגטיבה: רגל שמאל כפופה, ימין מושטת נמוך וכף יד ימין תומכת. תרגל רק לאחר שליטה בנגטיבה ובנשיאת משקל בשתי ידיים; פנה סביבך שטח לסיבוב.
    2. הנח גם את כף יד שמאל לפנים, ברוחב נוח מהימנית. הטה את המשקל בהדרגה לידיים ולכף רגל שמאל והרם מעט את האגן.
    3. אסוף מעט את רגל ימין והעבר אותה בצעד סביב הגוף לימין ולאחור. תן לרגל שמאל להסתובב על הרצפה בכיוון התנועה, בלי להשאיר ברך מסובבת מעל כף רגל תקועה.
    4. המשך בצעדים קטנים של הרגליים עד שהגוף פונה לכיוון הנגדי. העבר יד אחת בכל פעם למקום תמיכה נוח; לפחות יד אחת ורגל אחת נשארות תומכות בכל מעבר.
    5. הנמך שוב את האגן לבסיס נמוך עם שמאל כפופה וימין מושטת, אסוף את הרגליים וקום בשליטה. המעבר והקימה הם חזרה אחת; בצע 2–3 חזרות ואז החלף צד.
    שים לב: זהו רולה איטי בצעדים, בלי קפיצה ובלי גלגול על הראש או הצוואר. אם הסיבוב אינו רציף, עצור בכריעה, שחרר את הידיים וחזור לנגטיבה במקום להאיץ.

