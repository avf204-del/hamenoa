  loadClass: "bodyweight"
  unilateral: true
  repPaceSecPerRep: 9
  systemicCost: "med"
  constraints: ["space"]
  substitutes: ["capoeira-esquiva-basica"]
  scalingEasier: "capoeira-esquiva-basica"
  scalingHarder: "capoeira-role"
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["shoulders", "abdominals", "triceps"]
  instructionsHe: |-
    1. בחר משטח נקי, יציב ולא מחליק. התחל בכריעה נמוכה ונוחה, שתי כפות הרגליים על הרצפה; דרושה יכולת ירידה ועלייה בשליטה ותמיכת יד ללא כאב.
    2. העבר את האגן לכיוון עקב שמאל והנח את כף יד ימין על הרצפה לצד ימין של האגן. השאר את מרפק ימין רך ואת הכתף פעילה.
    3. הושט את רגל ימין קדימה באלכסון נמוך; העקב נוגע קלות ברצפה והברך אינה ננעלת. רגל שמאל נשארת כפופה מתחת לגוף.
    4. שמור את יד שמאל לפני הפנים, את הראש מורם ואת רוב המשקל על הרגל הכפופה ובתמיכת היד. עצור לרגע בבסיס הנמוך.
    5. החזר את כף רגל ימין אל הכריעה, העבר את המשקל לשתי הרגליים והרם את היד. קום בנחת; בצע 3 חזרות ואז החלף צד.
    שים לב: אל תישב בכוח על הברך הכפופה ואל תחליק את הרגל הישרה למרחק שאינו מאפשר חזרה. בהתחלה הושט את הרגל מעט בלבד; זו תנוחת קרקע נמוכה, לא נפילה אל הרצפה.

capoeira-role:
  source: null
  addedOn: "2026-09-17"
  nameHe: "רולה — מעבר סיבובי נמוך"
  nameEn: "Rolê — slow floor transition"
