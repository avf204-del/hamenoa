capoeira-ginga:
  source: null
  addedOn: "2026-09-17"
  nameHe: "ג׳ינגה — צעד בסיס"
  nameEn: "Ginga"
  trainingType: "capoeira"
  provenanceId: "moreira-2017-capoeira"
  modality: "gymnastics"
  pattern: "locomotion"
  equipment: []
  stationType: "none"
  skillLevel: 1
  loadClass: "bodyweight"
  unilateral: false
  repPaceSecPerRep: 8
  systemicCost: "low"
  constraints: ["space"]
  substitutes: ["capoeira-diagonal-step"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["calves", "abdominals"]
  instructionsHe: |-
    1. פנה סביבך מקום לצעד לאחור ולצד. עמוד ברגליים מעט מעבר לרוחב האגן, ברכיים רכות וידיים ליד הפנים.
    2. העבר את רגל ימין לאחור לצעד נוח. השאר את ברך שמאל כפופה מעל כיוון כף הרגל, והרם את אמה ימין לפני הפנים בלי להסתיר את המבט.
    3. החזר את רגל ימין לעמידה הרחבה דרך העברת משקל חלקה; אל תצמיד את הרגליים ואל תקפוץ.
    4. העבר כעת את רגל שמאל לאחור ואת אמה שמאל לפני הפנים. הגוף נוטה מעט קדימה מן הירכיים, בלי לקרוס בגב.
    5. חזור לעמידה הרחבה. ימין לאחור, מרכז, שמאל לאחור ומרכז הם מחזור אחד; תרגל 4–6 מחזורים איטיים ועצור בעמידה יציבה.
    שים לב: שמור על מרחק בין כפות הרגליים ועל נשימה רציפה. התחל בצעדים קצרים; הגדל את התנועה רק כשאפשר לשנות צד בלי לאבד שיווי משקל.

capoeira-esquiva-lateral:
  source: null
  addedOn: "2026-09-17"
  nameHe: "אסקיבה לטרלית — התחמקות לצד"
  nameEn: "Esquiva lateral"
  trainingType: "capoeira"
  provenanceId: "moreira-2017-capoeira"
  modality: "gymnastics"
  pattern: "squat"
  equipment: []
  stationType: "none"
  skillLevel: 2
  loadClass: "bodyweight"
  unilateral: true
  repPaceSecPerRep: 5
  systemicCost: "low"
  constraints: []
  substitutes: ["capoeira-esquiva-basica"]
  scalingEasier: null
  scalingHarder: "capoeira-esquiva-basica"
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["abdominals", "adductors"]
  instructionsHe: |-
    1. עמוד בפישוק נוח עם ברכיים רכות וידיים ליד הפנים. ודא שיש מרחב להטיית הגוף ימינה.
    2. העבר משקל אל רגל ימין וכופף את הברך בכיוון אצבעות הרגל; רגל שמאל נשארת ארוכה ורכה וכף רגלה על הרצפה.
    3. הטה את הגו לפנים ולימין דרך מפרקי הירך כדי להוריד את הראש מקו העמידה. שמור על אמה ימין ליד הראש ועל מבט קדימה.
    4. עצור לרגע בגובה שנשלט בלי תמיכת יד ברצפה. דחוף דרך רגל ימין והחזר את האגן למרכז תוך הזדקפות.
    5. בצע 3–5 ירידות וחזרות לימין, אחר כך אותו מספר לשמאל בתמונת ראי. חזרה אחת היא ירידה וחזרה למרכז.
    שים לב: ההתחמקות נוצרת מכיפוף רגל והטיית אגן, לא ממשיכה בצוואר או מקריסת ברך פנימה. אם קשה לחזור בשליטה, הקטן את הפישוק ואת עומק הירידה.

capoeira-diagonal-step:
  source: null
  addedOn: "2026-09-17"
  nameHe: "התקדמות אלכסונית בקפוארה"
  nameEn: "Deslocamento em diagonal — controlled step"
  trainingType: "capoeira"
  provenanceId: "moreira-2017-capoeira"
  modality: "gymnastics"
  pattern: "locomotion"
  equipment: []
  stationType: "none"
  skillLevel: 1
  loadClass: "bodyweight"
  unilateral: true
  repPaceSecPerRep: 6
  systemicCost: "low"
  constraints: ["space"]
  substitutes: ["capoeira-ginga"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["calves", "abdominals"]
  instructionsHe: |-
    1. עמוד בבסיס רחב ורך, ידיים מגינות על הפנים. בחר קו פנוי באלכסון קדימה וימינה, באורך של צעד אחד.
    2. צעד ברגל ימין לאלכסון שבחרת והעבר אליה משקל בהדרגה. הראש והגו נעים עם האגן, בלי זינוק.
    3. קרב את רגל שמאל במידה שמחזירה בסיס נוח, בלי להצליב או להצמיד את כפות הרגליים. שמור על ברכיים כפופות מעט.
    4. חזור לנקודת המוצא בשני צעדים קטנים: שמאל תחילה ואז ימין, כשהמבט נשאר קדימה.
    5. צא וחזור 3–5 פעמים לאותו אלכסון, ואז החלף צד. יציאה וחזרה הן חזרה אחת; האט אם כפות הרגליים מתקרבות זו לזו.
    שים לב: זוהי התאמת צעדים איטית לתזוזה האלכסונית שבתרשים, לא תרגול מול התקפה. הטיית הגוף קלה; פנה מרחב גם למסלול החזרה.

capoeira-esquiva-basica:
  source: null
  addedOn: "2026-09-17"
  nameHe: "אסקיבה בסיסית — ירידה בתמיכת יד"
  nameEn: "Esquiva básica / Descida básica"
  trainingType: "capoeira"
  provenanceId: "moreira-2017-capoeira"
  modality: "gymnastics"
  pattern: "lunge"
  equipment: []
  stationType: "none"
  skillLevel: 3
  loadClass: "bodyweight"
  unilateral: true
  repPaceSecPerRep: 7
  systemicCost: "med"
  constraints: ["space"]
  substitutes: ["capoeira-esquiva-lateral"]
  scalingEasier: "capoeira-esquiva-lateral"
  scalingHarder: null
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["shoulders", "abdominals"]
  instructionsHe: |-
    1. על משטח יציב שאינו מחליק, עמוד כשרגל שמאל לפנים וימין מאחור. לפני התרגול ודא שנוח להניח כף יד פתוחה על הרצפה ולשאת עליה מעט משקל.
    2. כופף את ברך שמאל והנמך את האגן. ברך ימין מתקרבת לרצפה בלי לפגוע בה, והעקב האחורי מורם.
    3. הנח את כף יד שמאל על הרצפה בצד הפנימי של כף רגל שמאל, במקום שמאפשר לכתף להישאר יציבה. כופף את המרפק מעט ולא בכוח.
    4. הטה את הגו נמוך מעל הירך הקדמית ושמור את אמה ימין ליד הראש. עצור כשהעומק עדיין מאפשר חזרה רגועה.
    5. העבר את המשקל בחזרה לרגליים, הרם את כף היד והזדקף לבסיס המדורג. בצע 3–4 חזרות ואז החלף צד.
    שים לב: אל תיפול אל כף היד ואל תכפה הגעה לרצפה. אם התמיכה או החזרה אינן נשלטות, תרגל תחילה אסקיבה לטרלית רדודה; כאב בשורש כף היד הוא סיבה לצאת מהתמיכה.

capoeira-negativa:
  source: null
  addedOn: "2026-09-17"
  nameHe: "נגטיבה — ירידה לבסיס קרקע"
  nameEn: "Negativa"
  trainingType: "capoeira"
  provenanceId: "moreira-2017-capoeira"
