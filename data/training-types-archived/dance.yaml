  repPaceSecPerRep: 1
  systemicCost: "low"
  constraints: ["space"]
  substitutes: ["dance-variable-tempo-walk"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["calves", "abdominals"]
  instructionsHe: |-
    1. צייר על דף מסלול רציף קצר בלי חציות, למשל קו ישר שממשיך בקשת רחבה. הנח את הדף מחוץ לאזור התנועה וזכור את כיוון המסלול.
    2. פנה מהרצפה חפצים ובדוק שיש מרחב ללכת את המסלול. התחל בהליכה רגילה לאורכו במשך כ־10 שניות.
    3. בקטע הבא הורד מעט את גובה הגוף באמצעות כפיפה קטנה של הברכיים והמשך בצעדים קצרים במשך כ־10 שניות. שמור את הגו מאורגן מעל כפות הרגליים.
    4. סיים את המסלול בהליכה זקופה ובהושטת ידיים לגובה נוח במשך כ־10 שניות. אין צורך לעלות על קצות האצבעות או לקפוץ.
    5. נוח 15 שניות וחזור על אותו מסלול פעם נוספת, תוך בחירה עצמאית היכן לשנות גובה. כל מעבר במסלול נמשך כ־30 שניות.
    שים לב: שינויי הגובה קטנים ומבוקרים; אין צורך לרדת לרצפה. בצע פניות בקשת רחבה והבט לכיוון ההתקדמות. דף ועיפרון נדרשים רק לתכנון, מחוץ למשטח התנועה.

