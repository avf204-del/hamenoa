    2. אמור את המשפט בקול בקצב נוח והקשב להברות המודגשות ולהפסקות. חזור עליו תוך מחיאות כפיים קלות לפי המקצב ששמעת.
    3. החלף חלק ממחיאות הכפיים בתנועות פשוטות: צעד הצדה, קירוב הרגל השנייה והושטת יד. השאר הפסקה בתנועה במקום שבו יש הפסקה בדיבור.
    4. ארגן את המשפט והרצף למחזור של כ־8 שניות, כולל הפסקה קצרה בסוף אם צריך. שמור על אותו סדר תנועות בכל מחזור.
    5. תרגל עד שתוכל לבצע 4 מחזורים ברצף, עם המשפט בקול או בדמיון. סיים בעמידה יציבה וידיים רפויות.
