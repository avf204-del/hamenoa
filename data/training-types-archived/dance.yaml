  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["quadriceps", "glutes"]
  secondaryMuscles: ["calves", "shoulders", "abdominals"]
  instructionsHe: |-
    1. פנה סביבך מרחב של כמה צעדים ובחר רצף קצר שאפשר לזכור, למשל שני צעדים הצדה, הושטת יד קדימה וחזרה לעמידה.
    2. תרגל את הרצף פעם אחת בקצב נוח כך שיימשך בערך 10 שניות. קבע את אותו סדר פעולות ואת אותו מסלול לכל החזרות.
    3. בצע את הרצף באיכות רכה ורציפה: חבר את המעברים, הושט את היד בהדרגה ודרוך בשקט.
    4. בצע שוב את אותו רצף במשך כ־10 שניות, הפעם באיכות ברורה ומקוטעת: הוסף עצירות קצרות בין הפעולות, ללא מכות או תנופות חדות במפרקים.
    5. נוח כ־10 שניות וחזור על הזוג פעם נוספת. סך הכול 4 ביצועים של אותו רצף; ההבדל הוא באיכות התנועה ולא במהירות מרבית.
    שים לב: שמור על אותם צעדים גם כשהאיכות משתנה. תנועה מקוטעת אינה דורשת קפיצות, דריכה חזקה או נעילת מרפקים וברכיים.

dance-pathway-levels:
  source: null
  trainingType: "dance"
