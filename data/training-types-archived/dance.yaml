  systemicCost: "low"
  constraints: []
  substitutes: ["dance-out-out-in-in"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["shoulders"]
  secondaryMuscles: ["abdominals", "middle back"]
  instructionsHe: |-
    1. תרגל עם עוד משתתף אחד לפחות. סדרו כיסאות יציבים ללא גלגלים במעגל קטן, עם מרווח שבו הידיים אינן נוגעות זו בזו, והניחו כפות רגליים על הרצפה.
    2. המשתתף הראשון יוצר מחווה קצרה של כ־4 שניות בעזרת הידיים ותנועה קטנה של הגו, למשל פתיחה איטית של הזרועות.
    3. סיים את המחווה בכיוון המשתתף הבא או בסימן מוסכם. אפשר ליצור קשר עין אם נוח לשניכם, ללא מגע או העברת חפץ.
    4. המשתתף הבא מקבל את הרעיון ומשנה אותו: למשל מקטין את המחווה, משנה כיוון או מוסיף עצירה. לאחר מכן הוא מעביר את המחווה הלאה.
    5. השאירו לכל משתתף כ־8 שניות לתנועה ולהעברה, עד שהמחווה משלימה שני סבבים. בזוג פשוט מעבירים הלוך ושוב עד שכל אחד ביצע פעמיים.
    שים לב: נדרשים לפחות שני משתתפים. ההעברה היא סימן תנועתי, ללא דחיפה או משיכה; אפשר להישאר בתנועה קטנה ואין חובה לקשר עין. שמרו על כיסאות יציבים.

