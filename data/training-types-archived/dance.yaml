  primaryMuscles: ["abdominals", "shoulders"]
  secondaryMuscles: ["glutes", "quadriceps"]
  instructionsHe: |-
    1. עמוד בחלל פנוי עם שתי כפות רגליים על הרצפה וברכיים רכות. בחר שלושה דימויים, למשל עץ, גשר וקשר בין אנשים.
    2. צור בידיים ובגו צורה שמזכירה את הדימוי הראשון. אפשר להשתמש בקווים ישרים, בקשתות או במרווח שבין הזרועות.
    3. הישאר בצורת הגוף 3 שניות, ואז עבור במשך כשלוש שניות לצורה השנייה. אין צורך לחקות צורה מדויקת או לשמור על סימטריה.
    4. החזק גם את הצורה השנייה 3 שניות ועבור באיטיות לשלישית. השאר את שתי הרגליים על הרצפה לאורך החקירה.
    5. חזור על שלוש הצורות פעם נוספת: 6 החזקות בסך הכול. בסיום השווה לעצמך איזו צורה מרגישה רחבה, צרה או מעוגלת.
    שים לב: בחר צורות שאפשר לצאת מהן בקלות. הימנע מנעילת ברכיים, מעצירת נשימה וממתיחה מעבר לטווח נוח; זהו תרגיל בחירה תנועתית ללא צורה אחת נכונה.

