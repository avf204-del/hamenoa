  systemicCost: "low"
  constraints: []
  substitutes: ["dance-body-shape-exploration"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["shoulders"]
  secondaryMuscles: ["abdominals", "middle back"]
  instructionsHe: |-
    1. שב על כיסא יציב ללא גלגלים, השאר שתי כפות רגליים על הרצפה ופנה מקום סביב הזרועות.
    2. בשתי ספירות איטיות שלח את יד ימין לכיוון שתבחר, ובשתי הספירות הבאות שלח את יד שמאל לכיוון אחר. בחר גובה וטווח נוחים.
    3. בשתי הספירות הבאות החזר את יד ימין לכיוון מרכז הגוף, ואז בשתי ספירות נוספות החזר את יד שמאל. זהו מחזור אחד של החוצה, החוצה, פנימה, פנימה.
    4. במחזור הבא שנה את המסלול: למשל יד אחת לפנים והשנייה באלכסון נמוך. אפשר להוסיף תנועה קטנה של הגו כל עוד האגן נשאר יציב על הכיסא.
    5. בצע 4 מחזורים של כ־8 שניות, נשום בחופשיות ונוח 15 שניות. אם נוח, בצע קבוצה נוספת של 4 מחזורים עם מסלולים חדשים.
    שים לב: הדוגמה מציעה מבנה לתנועה ואפשר לבחור מסלולים משלך. אל תטה את הכיסא, תזרוק את הראש או תשלח יד אל מעבר לטווח שבו הישיבה יציבה.

dance-pass-the-gesture:
  source: null
  trainingType: "dance"
  provenanceId: "batson-2016-improvment"
  addedOn: "2026-09-17"
  nameHe: "מחול יצירתי בקבוצה — מעבירים מחווה"
