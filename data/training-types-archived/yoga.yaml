yoga-supported-wrist-stretch:
  source: null
  trainingType: "yoga"
  provenanceId: "gandolfi-2023-office-yoga"
  addedOn: "2026-09-17"
  nameHe: "יוגה בישיבה — מתיחת שורשי כפות הידיים"
  nameEn: "Seated Yoga Wrist Stretch"
  modality: "gymnastics"
  pattern: "pushH"
  equipment: ["chair"]
  stationType: "portable"
  skillLevel: 1
  loadClass: "bodyweight"
  unilateral: false
  repPaceSecPerRep: 1
  systemicCost: "low"
  constraints: []
  substitutes: ["yoga-seated-chest-opening"]
  scalingEasier: null
  scalingHarder: null
  primaryMuscles: ["forearms"]
  secondaryMuscles: ["shoulders"]
  instructionsHe: |-
    1. שב על כיסא יציב ללא גלגלים, עם מקום פנוי במושב ליד הירכיים. הנח את שתי כפות הרגליים במלואן על הרצפה.
    2. הנח את כפות הידיים על המושב לצד הירכיים, עם אצבעות מופנות לאחור ככל שנוח. אפשר לסובב מעט את הידיים החוצה כדי להפחית את המתיחה.
    3. השאר את הישבן על הכיסא ואת המרפקים מעט רכים. העבר רק מעט משקל אל כפות הידיים, עד לתחושת מתיחה קלה באמות.
    4. נשום כרגיל והישאר 15 שניות. אין צורך להרים את הגוף או ללחוץ בכוח על המושב.
    5. הפחת את הלחץ לפני הרמת הידיים. הנח אותן על הירכיים, נוח 10 שניות ובצע פעם נוספת אם נוח.
    שים לב: אל תכפה את סיבוב כף היד ואל תישען על משענות הכיסא. הפסק אם מופיעים כאב, נימול או לחץ חד במפרק. זמן ההחזקה נספר בשניות.

