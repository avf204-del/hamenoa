  secondaryMuscles: ["chest", "shoulders"]
  instructionsHe: |-
    1. שב זקוף על כיסא יציב ללא גלגלים, עם כפות רגליים מלאות על הרצפה. השאר את האגן יציב ואת כפות הידיים על הירכיים.
    2. בשאיפה נינוחה של כשלוש שניות, הרם מעט את עצם החזה קדימה ולמעלה. אפשר לשכמות להתקרב מעט זו לזו בלי לכווץ אותן בכוח.
    3. צור קשת קטנה בחלק העליון של הגב. השאר את הסנטר קרוב למנח הרגיל ואת המבט קדימה; הראש אינו נזרק לאחור.
    4. בנשיפה של כשלוש שניות חזור לגב זקוף וניטרלי. אל תעבור לכפיפה עמוקה קדימה.
    5. המתן כשתי שניות ובצע בסך הכול 5 חזרות איטיות. אם ספירת הנשימה אינה נוחה, נשום באופן חופשי והקטן את התנועה.
    שים לב: המטרה היא תנועה קטנה של החזה, ללא דחיפה חזקה בידיים או קשת גדולה במותניים. הפסק בכאב ואל תעצור את הנשימה.

