    2. הנח את יד ימין על צד המושב והעבר את יד שמאל בקשת מעל הראש, עם מרפק מעט כפוף. אם הרמה מעל הראש אינה נוחה, הנח את יד שמאל על המותן.
    3. התארך כלפי מעלה, ואז הטה מעט את בית החזה לימין בלי לפנות קדימה או לאחור. השאר את שני צדי האגן במגע עם המושב.
